<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img"
    aria-label="Imagen disponible solo para amigos">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0b1220" />
            <stop offset="1" stop-color="#070c14" />
        </linearGradient>
    </defs>

    <rect x="48" y="48" width="928" height="928" rx="40" fill="url(#bg)" stroke="#cbd5e1" stroke-opacity="0.28"
        stroke-width="3" stroke-dasharray="14 14" />

    <!-- Icon: image -->
    <g fill="none" stroke="#e2e8f0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
        <rect x="332" y="250" width="360" height="250" rx="22" />
        <circle cx="420" cy="330" r="20" />
        <path d="M360 470l90-90 70 70 50-50 122 122" />
    </g>

    <!-- Icon: lock + heart -->
    <g fill="none" stroke="#e2e8f0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
        <rect x="472" y="430" width="120" height="140" rx="18" />
        <path d="M506 430v-26c0-24 20-44 44-44s44 20 44 44v26" />
        <circle cx="532" cy="502" r="7" fill="#e2e8f0" stroke="none" />
        <path d="M532 510v22" />

        <!-- heart -->
        <path
            d="M532 618c-28-18-54-38-54-64 0-16 13-29 29-29 12 0 21 6 25 14 4-8 13-14 25-14 16 0 29 13 29 29 0 26-26 46-54 64z" />
    </g>

    <!-- Text -->
    <text x="512" y="680" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="36" font-weight="800"
        fill="#f8fafc">
        Imagen disponible
    </text>
    <text x="512" y="730" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="30" font-weight="700"
        fill="#e2e8f0" opacity="0.95">
        solo para amigos
    </text>
    <text x="512" y="790" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="22" font-weight="600"
        fill="#94a3b8">
        Agregalo como amigo para verla
    </text>
</svg>